name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Check, build, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, build, test and package
        run: npm run package
